<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bluebird · Connexion</title>
  <meta name="theme-color" content="#0E1B2A" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Cette page est la porte d'entrée : nginx la sert AVANT toute vérification
       de cookie. Elle ne peut donc charger ni css/styles.css ni les modules de
       l'appli, qui sont derrière la serrure — ce serait l'œuf et la poule.
       Tout est donc en ligne ici, sans une seule dépendance externe. -->
  <style>
    :root {
      --ink: #0E1B2A; --ink-1: #13243A; --line: #22354E;
      --text: #E8EEF5; --muted: #93A7BD; --bluebird: #4FA3C7; --rouge: #B0566A;
      --ui: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--ink); color: var(--text);
      font-family: var(--ui); -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center;
      padding: 24px calc(16px + env(safe-area-inset-left)) 24px calc(16px + env(safe-area-inset-right));
    }
    form {
      width: 100%; max-width: 340px; text-align: center;
      background: var(--ink-1); border: 1px solid var(--line);
      border-radius: 18px; padding: 32px 24px 26px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }
    img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 14px; }
    h1 { font-family: var(--display); font-size: 34px; font-weight: 600; margin: 0 0 2px; letter-spacing: .01em; }
    p.sub { margin: 0 0 20px; font-size: 13px; color: var(--muted); letter-spacing: .02em; }
    input {
      width: 100%; font-family: inherit; font-size: 19px; text-align: center;
      color: var(--text); background: var(--ink); border: 1px solid var(--line);
      border-radius: 12px; padding: 13px 14px; margin-bottom: 12px;
    }
    input:focus { outline: none; border-color: var(--bluebird); }
    button {
      width: 100%; font-family: inherit; font-size: 17px; font-weight: 700;
      color: #06222E; background: var(--bluebird); border: 1px solid var(--bluebird);
      border-radius: 12px; padding: 13px 14px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    p.msg { margin: 14px 0 0; font-size: 13px; font-weight: 600; color: var(--rouge); min-height: 1em; }
  </style>
</head>
<body>
  <form id="f">
    <img src="/assets/icons/icon-192.v2.png" alt="" />
    <h1>Bluebird</h1>
    <p class="sub">Caisse — accès réservé</p>
    <input id="pw" type="password" autocomplete="current-password"
           placeholder="Mot de passe" enterkeyhint="go" autofocus />
    <button id="go" type="submit">Se connecter</button>
    <p class="msg" id="msg"></p>
  </form>

  <script>
    // Aucun service worker ici : cette page doit toujours venir du réseau, sinon
    // une version périmée pourrait empêcher de se reconnecter.
    var f = document.getElementById('f');
    var pw = document.getElementById('pw');
    var go = document.getElementById('go');
    var msg = document.getElementById('msg');

    f.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!pw.value) { pw.focus(); return; }
      msg.textContent = '';
      pw.disabled = true; go.disabled = true; go.textContent = 'Vérification…';

      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        // Indispensable : c'est la réponse de cette requête qui pose le cookie.
        credentials: 'same-origin',
        body: JSON.stringify({ password: pw.value })
      }).then(function (r) {
        if (r.status === 401) throw new Error('motdepasse');
        if (!r.ok) throw new Error('serveur');
        return r.json();
      }).then(function (data) {
        // Le mot de passe de l'agent d'impression n'ouvre pas la caisse.
        if (data.role && data.role !== 'full') throw new Error('motdepasse');
        // `replace` : la page de connexion ne reste pas dans l'historique.
        location.replace('/');
      }).catch(function (err) {
        msg.textContent = err.message === 'motdepasse'
          ? 'Mot de passe incorrect.'
          : 'Serveur injoignable — vérifie la connexion.';
        pw.disabled = false; go.disabled = false; go.textContent = 'Se connecter';
        pw.focus(); pw.select();
      });
    });
  </script>
</body>
</html>
